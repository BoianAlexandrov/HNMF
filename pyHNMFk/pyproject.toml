[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnmf-tr-optimizer"
version = "0.0.1"
description = "Hybrid-NMFk using trust-region optimization"
requires-python = ">=3.10"

dependencies = [
    "jax",
    "orthax",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.14.1",
    "scikit-learn==1.5.1"
]