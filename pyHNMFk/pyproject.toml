[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnmf-tr-optimizer"
version = "0.0.1"
description = "Hybrid- NMFk using trust-region optimizatio"
requires-python = ">=3.10"

dependencies = [
    "jax==0.4.31",
    "numpy==2.1.1",
    "pandas==2.2.2",
    "scipy==1.14.1",
    "scikit-learn==1.5.1"
]